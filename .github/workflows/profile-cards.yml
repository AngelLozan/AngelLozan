name: Update profile cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=AngelLozan&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=AngelLozan&hide_title=true&theme=tokyonight&langs_count=10&layout=compact&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: AngelLozan

      - name: Trophies
        # The official host is disabled; try community mirrors in order and
        # keep the last committed card if none respond.
        run: |
          query="username=AngelLozan&theme=tokyonight&column=7&margin-w=10&margin-h=10"
          for host in github-profile-trophy github-profile-repo github-profile-trophy-unserori github-trophy-jagratadeb; do
            if curl -fsS --max-time 30 "https://$host.vercel.app/?$query" -o /tmp/trophy.svg && grep -q "<svg" /tmp/trophy.svg; then
              mkdir -p profile && mv /tmp/trophy.svg profile/trophy.svg
              echo "Trophies from $host"
              exit 0
            fi
          done
          echo "::warning::No trophy mirror responded; keeping the existing card"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile profile-3d-contrib
          git commit -m "Update profile cards" || exit 0
          git push
